<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OGC Industries — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Inter:wght@300..500&display=swap" rel="stylesheet" />
<style>
  /* ── TOKENS ── */
  :root {
    --bg: #ffffff;
    --surface: #f4f4f4;
    --border: rgba(0,0,0,0.08);
    --text: #111111;
    --muted: #666666;
    --faint: #b0b0b0;
    --red: #c8102e;
    --red-hover: #a50d25;
    --red-tint: #fce4e8;
    --font-display: "Barlow Condensed", sans-serif;
    --font-body: "Inter", sans-serif;
  }

  /* ── RESET ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ── FULL-SCREEN LAYOUT ── */
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 2rem;
    text-align: center;
  }

  /* ── LOGO MARK ── */
  .logo-wrap {
    margin-bottom: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  .logo-icon { width: 56px; height: 56px; }

  .logo-name {
    font-family: var(--font-display);
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
  }

  .logo-tagline {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── DIVIDER ── */
  .divider {
    width: 40px;
    height: 2px;
    background: var(--red);
    border-radius: 2px;
    margin: 0 auto 2rem;
  }

  /* ── HEADLINE ── */
  h1 {
    font-family: var(--font-display);
    font-size: clamp(2.8rem, 8vw, 5.5rem);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    line-height: 1.0;
    color: var(--text);
    margin-bottom: 1rem;
  }

  h1 span { color: var(--red); }

  /* ── SUBTEXT ── */
  p.sub {
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    color: var(--muted);
    max-width: 42ch;
    line-height: 1.7;
    margin: 0 auto;
  }

  /* ── SOCIAL LINKS ── */
  .social-links {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-top: 2rem;
  }

  .social-links a {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: color 180ms ease;
  }

  .social-links a:hover { color: var(--red); }

  /* ── FOOTER ── */
  footer {
    position: fixed;
    bottom: 1.5rem;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.72rem;
    color: var(--faint);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ── MOBILE ── */
  @media (max-width: 480px) {
    h1 { font-size: 2.8rem; }
  }
</style>
